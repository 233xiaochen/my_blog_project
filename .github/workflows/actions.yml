name: Java CI with Maven

on:
  push:
    branches: [ "master" ] 
  pull_request:
    branches: [ "master" ] 

jobs:
  compile:
    runs-on: ubuntu-latest
    name: Running Java 
    steps:
    - uses: actions/checkout@master
    - name: Set up JDK 8
      uses: actions/setup-java@master
      with:
        java-version: '8'
        distribution: 'adopt'
        cache: maven
    - name: Build with Maven
      run: mvn clean package --file pom.xml
    - name: 将 JAR 包部署到服务器
      uses: garygrossgarten/github-action-scp@release
      with:
          local: target/springSecurity_project-0.0.1-SNAPSHOT.jar
          remote: www/springSecurity_project-0.0.1-SNAPSHOT.jar
          host: 124.71.99.191
          username: chen
          password: use6953136
              
    - name: Deploy
      uses: appleboy/ssh-action@master
      with:
          host: 124.71.99.191
          username: chen
          password: use6953136
          port: 22
          script: |
            cd /www
            nohup java -jar springSecurity_project-0.0.1-SNAPSHOT.jar > wechart.log 2>&1 &

