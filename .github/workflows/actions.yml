name: Java CI with Maven
on:
  push:
    branches:
      - master  
  pull_request:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest 
    steps:
      - name: pull latest code
        uses: actions/checkout@v3 
      - name: Set up JDK 1.8
        uses: actions/setup-java@v3
        with:
          java-version: '8.0' 
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn clean package
      - name: Build docker image
        run: |                               
          docker build -t spring-security-project:0.1 .
          docker save -o dingsai-backend.tar spring-security-project:0.1
      - name: delete old docker image
        run: sshpass -p use6953136 ssh -o StrictHostKeyChecking=no chen@124.71.99.191 "docker stop spring-security-project || true && docker rm spring-security-project || true && docker rmi spring-security-project:0.1 || true"
      - name: delete old docker tar
        run: sshpass -p use6953136 ssh -o StrictHostKeyChecking=no chen@124.71.99.191 "rm -f dingsai-backend.tar"
      - name: upload new docker image and start-up script
        run: sshpass -p use6953136 scp -r -o StrictHostKeyChecking=no ./dingsai-backend.tar chen@124.71.99.191:./
      - name: load new docker image
        run: sshpass -p use6953136 ssh -o StrictHostKeyChecking=no chen@124.71.99.191 "docker load -i ./dingsai-backend.tar"
      - name: run project
        run: sshpass -p use6953136 ssh -o StrictHostKeyChecking=no chen@124.71.99.191 "docker run -d -p 8888:8888 --name spring-security-project --network java-mysql-network spring-security-project:0.1"
