name: Build and Deploy Java App to Remote Server
 
on:
  push:
    branches: [ master ]
jobs:
  develop_build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取最新提交的代码
        uses: actions/checkout@v3

      - name: 设置jdk
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'maven'

      - name: 项目打包
        run: mvn -B package

      - name: 删除旧的jar包以及运行脚本
        run: sshpass -p use6953136 ssh -o StrictHostKeyChecking=no chen@124.71.99.191 "sudo cd /root/GitHub_Action && sudo rm -rf ./*"

      - name: 上传jar包和启动脚本到服务器中
        run: sshpass -p use6953136 scp -r -o StrictHostKeyChecking=no ./target/springSecurity_project-0.0.1-SNAPSHOT.jar ./run.sh chen@124.71.99.191:/root/GitHub_Action

      - name: 启动项目
        run: sshpass -p use6953136 ssh -o StrictHostKeyChecking=no chen@124.71.99.191 "cd /root/GitHub_Action && chmod +x run.sh && ./run.sh"
