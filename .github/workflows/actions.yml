name: Java CI with Maven

on:
  push:
    branches: [ "master" ] 
  pull_request:
    branches: [ "master" ] 
jobs:
  deploy:
    runs-on: ubuntu-latest  # 使用 Ubuntu 环境

    steps:
      - name: Checkout code  # 拉取代码
        uses: actions/checkout@v2

      - name: Set up Docker Buildx  # 设置 Docker Buildx，用于构建多平台镜像
        uses: docker/setup-buildx-action@v1
        with:
          driver-opts: path=/var/run/docker.sock
          
      - name: Save Docker Buildx Info
        run: echo "BUILDX_INFO=$(docker buildx version --json)" >> $GITHUB_ENV

      - name: Build Docker image  # 构建 Docker 镜像
        run: |
          docker buildx create --name mybuilder
          docker buildx use mybuilder
          docker buildx inspect --bootstrap
          docker buildx build --platform linux/amd64,linux/arm64 -t spring-boot-app:latest .

      - name: Deploy to remote server  # 部署到远程服务器
        uses: appleboy/ssh-action@master
        with:
          host: 124.71.99.191
          username: chen
          password: use6953136
          script: |
            docker stop spring-boot-app || true
            docker rm spring-boot-app || true
            docker load < spring-boot-app-latest.tar  # 从本地加载 Docker 镜像
            docker run -d --name spring-boot-app -p 8080:8080 spring-boot-app:latest
