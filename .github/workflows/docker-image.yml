name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build and package the Maven project
      run: mvn clean package

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%Y%m%d%H%M)
      
    - name: Push Docker images to registry
      run: |
        docker login 124.71.99.191 --username $DOCKER_USERNAME --password $DOCKER_PASSWORD
        docker push 124.71.99.191/my-image-name:$(date +%Y%m%d%H%M)
