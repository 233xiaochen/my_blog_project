name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build and package the Maven project
      run: mvn clean package

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)

    - name: Push Docker images to registry
      run: |
        echo $DOCKER_PASSWORD | docker login 124.71.99.191 --username $DOCKER_USERNAME --password-stdin
        docker push 124.71.99.191/your-image-name:$(date +%s)
